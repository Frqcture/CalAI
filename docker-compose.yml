services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calai
      POSTGRES_USER: calai
      POSTGRES_PASSWORD: calai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ai-service:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8100"]
    working_dir: /srv
    ports:
      - "8100:8100"

  license-service:
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8200"]
    working_dir: /srv
    ports:
      - "8200:8200"

volumes:
  pgdata:
  qdrant_data:
